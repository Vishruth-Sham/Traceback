[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "traceback-local"
version = "0.1.1"
description = "Local-first Traceback REST backend"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  # Pinned narrowly (not just <3): traceback_mcp imports the internal
  # mcp.server.mcpserver.exceptions.ToolError, which has no public
  # re-export and is not covered by the SDK's compatibility guarantees.
  "mcp>=2.2.0,<2.3.0",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "processor", "traceback_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
