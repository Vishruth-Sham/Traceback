<!-- @dsCard group="Specification" height=620 subtitle="One panel, nine states" -->
<div id="root"></div>
<script>
  (function () {
    var el = document.getElementById("root");
    var states = [
      ["1. Idle / ready", Traceback.panelIdle()],
      ["2. Recording", Traceback.panelRecording(4)],
      ["3. Processing", Traceback.panelProcessing("Show my overdue tasks", "Finding tasks…")],
      ["4. Successful result", Traceback.panelConfirm("<b>Opened:</b> Projects / DSA Learning")],
      ["5. Multiple matches", Traceback.panelMultiple({ title: "RESULTS", count: 2, rows: [["Normal Forms", "Learning / Database Systems"], ["Database Normalization", "Projects / Course Notes"]], hint: "open the first one" })],
      ["6. No results", Traceback.panelNoResults("Find my note about quantum entanglement")],
      ["7. Backend unavailable", Traceback.panelUnavailable({ title: "Processor unavailable", detail: "Start the background service, or type instead." })],
      ["8. Microphone permission missing", Traceback.panelPermission()],
      ["9. Cancelled", Traceback.panelCancelled()]
    ];
    var cells = states.map(function (s) {
      return (
        '<div class="tb-spec-cell">' +
        '<div class="tb-spec-cell__label">' + s[0] + "</div>" +
        s[1] +
        "</div>"
      );
    }).join("");
    el.innerHTML =
      '<div class="tb-reset" style="background: var(--color-surface-100); padding: 20px; font-family: var(--type-family-mono);">' +
      '<div style="font-size:12px; color:var(--color-ink-muted); margin-bottom:14px;">Same component, same 460px dock, same 1.5px outline weight &mdash; only the content and border-emphasis change per state. Recording pulses; every other transition is instant.</div>' +
      '<div class="tb-spec-grid">' + cells + "</div>" +
      "</div>";
  })();
</script>
