<!-- @dsCard group="Notifications" height=170 subtitle="Ambiguous match, unfocused" -->
<div id="root"></div>
<script>
  (function () {
    var el = document.getElementById("root");
    el.innerHTML =
      '<div class="tb-reset" style="position:relative; width:100%; height:150px; background: var(--color-surface-300); font-family: var(--type-family-mono);">' +
      Traceback.notification({
        title: '“DSA Learning” matched 2 items',
        body: "Open Traceback to choose.",
        action: "Open Traceback"
      }) +
      "</div>";
    var n = el.querySelector(".tb-notification");
    n.style.position = "absolute";
    n.style.top = "12px";
    n.style.right = "12px";
  })();
</script>
