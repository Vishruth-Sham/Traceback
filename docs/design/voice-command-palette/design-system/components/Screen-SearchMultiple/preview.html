<!-- @dsCard group="Screens · P0 voice flow" height=380 width=1440 subtitle="4. Search, multiple matches" -->
<div id="root"></div>
<script>
  (function () {
    var el = document.getElementById("root");
    Traceback.shell(el, { active: "Notes", bodyHtml: Traceback.bodyInbox() });
    el.querySelector(".tb-frame").insertAdjacentHTML(
      "beforeend",
      Traceback.panelMultiple({
        title: 'Results for “normal forms”',
        count: 2,
        rows: [
          ["Normal Forms", "Learning / Database Systems"],
          ["Database Normalization", "Projects / Course Notes"]
        ],
        hint: "open the first one"
      })
    );
  })();
</script>
