<!-- @dsCard group="Screens · P0 voice flow" height=380 width=1440 subtitle="6. Backend unavailable" -->
<div id="root"></div>
<script>
  (function () {
    var el = document.getElementById("root");
    Traceback.shell(el, { active: "Tasks", bodyHtml: Traceback.bodyTasksOverdue() });
    el.querySelector(".tb-frame").insertAdjacentHTML(
      "beforeend",
      Traceback.panelUnavailable({
        title: "Voice processing unavailable",
        detail: "The local processor isn’t running. Start Traceback’s background service, or type your search instead."
      })
    );
  })();
</script>
